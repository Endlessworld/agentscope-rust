[package]
name = "agentscope-extensions-postgresql"
description = "AgentScope Rust - PostgreSQL backed distributed persistence and advisory-lock guard"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Default build is dependency-light so the crate compiles/tests without a live
# PostgreSQL server. Enable `postgres-driver` to pull in the real `tokio-postgres`
# adapter (`PgSimpleClient`).
default = []
postgres-driver = ["dep:tokio-postgres", "dep:bytes", "tokio/rt-multi-thread"]
# Bounded connection reuse for `PgSimpleClient` (PG-05). Deliberately dependency-free: the
# pool is a few dozen lines over `tokio::sync::Semaphore`, so no `deadpool`/`bb8` is pulled in.
postgres-pool = ["postgres-driver"]
# Exposes `MemoryClient`, the in-memory SQL simulator, as library API for downstream tests
# (PG-07). Off by default so the test double cannot be mistaken for a real store.
testing = []

[dependencies]
agentscope-core = { workspace = true }
agentscope-harness = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

# Real PostgreSQL driver (optional, feature = "postgres-driver").
# `runtime` enables `Config::connect` / `tokio_postgres::connect` (they are feature-gated in
# tokio-postgres 0.7; without it this optional module did not compile at all).
tokio-postgres = { version = "0.7", optional = true, default-features = false, features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1", "runtime"] }
bytes = { version = "1", optional = true }

