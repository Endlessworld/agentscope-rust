[package]
name = "agentscope-extensions-nacos"
description = "AgentScope Rust - Nacos backed A2A registry, prompt and skill extensions"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Default build stays HTTP-stack free: `NacosHttpAiService` is compiled (its client logic is
# transport-agnostic and tested against a fake transport) but no `reqwest` is pulled in.
default = []
# Adds `ReqwestNacosTransport` (the real HTTP client) plus `spawn_polling`.
http-client = ["dep:reqwest"]

[dependencies]
agentscope-core = { workspace = true }
agentscope-harness = { workspace = true }
# A2A wire model (AgentCard / AgentSkill / AgentCapabilities / AgentProvider /
# AgentInterface) is reused from the protocol crate instead of being re-declared.
agentscope-extensions-a2a-client = { workspace = true }
# Protocol-side `AgentRegistry` (NACOS-01) lives in the A2A server crate; implementing it is
# what makes the Nacos registry reachable from `AgentRegistryService`.
agentscope-extensions-a2a-server = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }

# Nacos skill 包（ZIP）解析/重打包；版本已上提根 [workspace.dependencies]（2026-10-29）。
zip = { workspace = true }

# Real Nacos AI HTTP client (feature `http-client`, optional). `reqwest` is the workspace-pinned
# HTTP stack used by every other network extension crate.
reqwest = { workspace = true, optional = true }

