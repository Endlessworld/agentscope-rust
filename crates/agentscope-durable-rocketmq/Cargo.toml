[package]
name = "agentscope-durable-rocketmq"
description = "AgentScope Rust - durable adapter for the RocketMQ event channel (Java parity)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
agentscope-durable = { workspace = true }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
# Topic/tag derivation needs a stable digest; `agentscope-durable` keeps its hashing private.
sha2.workspace = true

[dev-dependencies]
# Path-only on purpose: cargo drops version-less dev-dependencies when packaging, while a version
# here would require `agentscope-durable-worker` on the index before this crate can be packaged.
agentscope-durable-worker = { path = "../agentscope-durable-worker" }