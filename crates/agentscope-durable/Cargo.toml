[package]
name = "agentscope-durable"
description = "AgentScope Rust - Durable recoverable runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
futures.workspace = true
tracing.workspace = true
sha2.workspace = true

# `tokio` is only used by the unit tests in `runtime.rs` (`#[tokio::test]`): keeping it a
# dev-dependency stops every dependent crate from pulling the runtime in through this one.
[dev-dependencies]
tokio.workspace = true
# The store-model probe writes a throwaway database; production code does not use it.
rusqlite.workspace = true
# The contract test can run every invariant against SQLite by setting DURABLE_CONTRACT_STORE=sqlite.
agentscope-durable-sqlite = { path = "../agentscope-durable-sqlite" }

# Liveness of the process that owns a scope lock file.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
