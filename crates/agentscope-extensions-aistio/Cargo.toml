[package]
name = "agentscope-extensions-aistio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
agentscope-core = { path = "../agentscope-core" }
agentscope-harness = { path = "../agentscope-harness" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["net"] }
futures = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }

# In-process `/agentscope/*` contract server (mirrors JDK com.sun.net.httpserver).
axum = { version = "0.7", default-features = false, features = ["json", "tokio", "http1", "query"] }
http = "1"
bytes = "1"

