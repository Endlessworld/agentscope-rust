[package]
name = "agentscope-extensions-jdbc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The default build pulls in **no** driver crate and compiles/tests fully offline against
# SQLite (`RusqliteExecutor`). Driver backends are opt-in:
default = []
# Real PostgreSQL backend (`backend::driver::PostgresSqlClient`, `connect_postgres`).
# Enables the env-gated integration tests in `tests/postgres_integration_tests.rs` too.
postgres-executor = ["dep:tokio-postgres"]
# Real MySQL backend (`backend::driver::MysqlSqlClient`, `connect_mysql`) with native
# `GET_LOCK` / `RELEASE_LOCK` sessions. Enables the env-gated integration tests in
# `tests/mysql_integration_tests.rs` too.
mysql-executor = ["dep:mysql_async"]

[dependencies]
agentscope-core = { path = "../agentscope-core" }
agentscope-harness = { path = "../agentscope-harness" }
# Skill domain types (`AgentSkill`) come from harness; the repository backend contract
# (`AgentSkillRepository`) lives in the skills extension crate. Per §4.5 adjudication 2,
# the JDBC implementation lives here and the skills crate does not duplicate it.
agentscope-extensions-skills = { path = "../agentscope-extensions-skills" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
# SQLite execution backend. `rusqlite` is already a workspace-pinned dependency (used by
# core for its local SQLite store); referenced by name here, not added to the root
# [workspace.dependencies]. If SQLite is later promoted to an optional feature, this line
# moves behind a feature gate (see JDBC__GAP_TRACKER.md §4.2).
rusqlite = { workspace = true }
# SHA-256 for native advisory-lock name/key mapping (MySQL name normalization, PostgreSQL
# advisory-lock key folding). `sha2` is already a workspace-pinned dependency; referenced
# by name here, not added to the root [workspace.dependencies].
sha2 = { workspace = true }
# Real PostgreSQL driver, only with `feature = "postgres-executor"` (see [features]).
# `tokio-postgres` is workspace-registered and already resolved in `Cargo.lock`, so enabling
# the feature needs no lockfile change; its default `runtime` feature is exactly the
# `Config::connect` + background-connection-task support this backend needs.
tokio-postgres = { workspace = true, optional = true }
# Real MySQL driver, only with `feature = "mysql-executor"` (see [features]). The workspace
# pin is `mysql_async = "0.37"` and the crate is already resolved in `Cargo.lock` (through
# `agentscope-extensions-mysql`), with its sources present in the local registry, so enabling
# the feature adds a dependency edge only — no new crate, no network fetch.
mysql_async = { workspace = true, optional = true }

[dev-dependencies]
# Ground-truth SHA-256 for the native-lock key/name assertions (same pinned version as the
# crate dependency above; a dev-dependency so integration tests can recompute digests).
sha2 = { workspace = true }

