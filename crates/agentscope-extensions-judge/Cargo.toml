[package]
name = "agentscope-extensions-judge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Ports `agentscope-extensions-judge/agentscope-extensions-jev` (TypeSafe System One).
# The landed scope is dependency-free DTO + pure functions; the HTTP client lands later
# (see the module docs in `src/lib.rs`), so `agentscope-core` / `agentscope-harness` /
# `reqwest` are deliberately not declared yet.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
# Reached only through the injectable `http::JudgeHttpTransport` seam, so unit tests stay
# offline; `agentscope-core` / `agentscope-harness` remain undeclared by design.
reqwest = { workspace = true }
# `buffered` streams keep the Java `flatMapSequential` concurrency semantics for the runners.
futures = { workspace = true }
# Content-addressed context-archive references (Java `MessageDigest.getInstance("SHA-256")`).
sha2 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
