[package]
name = "agentscope-extensions-judge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Ports `agentscope-extensions-judge/agentscope-extensions-jev` (TypeSafe System One).
# `agentscope-core` / `agentscope-harness` are path dependencies of the `jev::runtime` seam
# module only: `BaseStore`-backed context archiving, the `Tool` implementations and the
# `Middleware` hooks. Every pure/DTO/orchestration module stays independent of them.
[dependencies]
agentscope-core = { path = "../agentscope-core" }
agentscope-harness = { path = "../agentscope-harness" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
# Reached only through the injectable `http::JudgeHttpTransport` seam, so unit tests stay
# offline.
reqwest = { workspace = true }
# `buffered` streams keep the Java `flatMapSequential` concurrency semantics for the runners.
futures = { workspace = true }
# Content-addressed context-archive references (Java `MessageDigest.getInstance("SHA-256")`).
sha2 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
