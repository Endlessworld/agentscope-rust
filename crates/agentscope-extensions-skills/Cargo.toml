[package]
name = "agentscope-extensions-skills"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The default build stays driver-free: only `InMemorySqlDatabase` is compiled and no new
# dependency is pulled in.
default = []
# Real PostgreSQL `SqlDatabase` over `tokio-postgres` (`src/driver/postgres.rs`).
postgres-driver = ["dep:tokio", "dep:tokio-postgres", "tokio/rt-multi-thread"]
# Real MySQL `SqlDatabase` over `mysql_async` (`src/driver/mysql.rs`).
mysql-driver = ["dep:tokio", "dep:mysql_async", "tokio/rt-multi-thread"]

[dependencies]
agentscope-harness = { path = "../agentscope-harness" }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }

# P1 driver seam (feature-gated, optional). Both driver crates are already pinned in the
# workspace `[workspace.dependencies]` for this purpose; nothing is added to the default build.
# `SyncBridge` (see `src/driver/mod.rs`) needs a Tokio runtime to drive the async drivers from
# the synchronous `SqlDatabase` seam.
tokio = { workspace = true, optional = true }
# `runtime` enables `Config::connect` / `tokio_postgres::connect` (feature-gated in 0.7).
tokio-postgres = { workspace = true, optional = true, features = ["runtime"] }
# `minimal` keeps the build free of TLS backends (no `aws-lc-sys` / OpenSSL); plain TCP only.
mysql_async = { workspace = true, optional = true, default-features = false, features = ["minimal"] }

# P2-10: `agentscope-core`, `async-trait`, `futures`, `chrono` and `serde` had zero references in
# `src/` (including derive macros), and `tokio` was only named in a doc comment - all removed,
# together with the unused dev-dependency on `tokio`. `base64` stays: `repository.rs` decodes
# `base64:` resource payloads with it.

