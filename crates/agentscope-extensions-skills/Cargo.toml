[package]
name = "agentscope-extensions-skills"
description = "AgentScope Rust - skill repository backends (git, MySQL, PostgreSQL)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# The default build stays driver-free: only `InMemorySqlDatabase` is compiled and no new
# dependency is pulled in.
default = []
# Real PostgreSQL `SqlDatabase` over `tokio-postgres` (`src/driver/postgres.rs`).
postgres-driver = ["dep:tokio", "dep:tokio-postgres", "tokio/rt-multi-thread"]
# TLS for the PostgreSQL driver, over `rustls` (`src/driver/pg_tls.rs`). Opt-in: the default and
# driver-only builds compile no TLS backend at all.
postgres-tls = [
    "postgres-driver",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:webpki-roots",
]
# Real MySQL `SqlDatabase` over `mysql_async` (`src/driver/mysql.rs`).
mysql-driver = ["dep:tokio", "dep:mysql_async", "tokio/rt-multi-thread"]
# TLS for the MySQL driver: `mysql_async`'s own `rustls` backend (`ring`, no `aws-lc-sys`).
mysql-tls = [
    "mysql-driver",
    "mysql_async/rustls-tls",
    "mysql_async/tls12",
    "mysql_async/ring",
]

[dependencies]
agentscope-harness = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }

# P1 driver seam (feature-gated, optional). Both driver crates are already pinned in the
# workspace `[workspace.dependencies]` for this purpose; nothing is added to the default build.
# `SyncBridge` (see `src/driver/mod.rs`) needs a Tokio runtime to drive the async drivers from
# the synchronous `SqlDatabase` seam.
tokio = { workspace = true, optional = true }
# `runtime` enables `Config::connect` / `tokio_postgres::connect` (feature-gated in 0.7).
tokio-postgres = { workspace = true, optional = true, features = ["runtime"] }
# `minimal` keeps the build free of TLS backends (no `aws-lc-sys` / OpenSSL); plain TCP only.
# `default-features` is deliberately absent: cargo ignores it for a workspace dependency
# (`default-features` was not specified for `workspace.dependencies.mysql_async`) and warns on
# every build, without changing the resolved feature set.
mysql_async = { workspace = true, optional = true, features = ["minimal"] }

# TLS backends (opt-in through `postgres-tls` / `mysql-tls`). Not inherited from the workspace
# because these are only needed here; the versions mirror the ones already resolved in
# `Cargo.lock`. `default-features = false` on both rustls consumers keeps the `aws-lc-rs`
# provider (and its `aws-lc-sys` C build) out of the graph: only the pure-Rust `ring` provider
# is compiled.
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = [
    "logging",
    "tls12",
    "ring",
] }
rustls = { version = "0.23", optional = true, default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
rustls-native-certs = { version = "0.8", optional = true }
webpki-roots = { version = "0.26", optional = true }

# P2-10: `agentscope-core`, `async-trait`, `futures`, `chrono` and `serde` had zero references in
# `src/` (including derive macros), and `tokio` was only named in a doc comment - all removed,
# together with the unused dev-dependency on `tokio`. `base64` stays: `repository.rs` decodes
# `base64:` resource payloads with it.

