[package]
name = "agentscope-extensions-scheduler"
description = "AgentScope Rust - scheduled agent execution (Quartz-style scheduler and XXL-Job handlers)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
agentscope-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Only the test stub models build a `BoxStream`; production code never touches it.
futures = { workspace = true }
# `test-util`: the misfire / first-firing tests drive `tokio::time` with a paused
# clock instead of sleeping real time, so cadence assertions stay deterministic.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
