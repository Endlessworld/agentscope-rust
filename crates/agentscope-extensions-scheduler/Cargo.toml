[package]
name = "agentscope-extensions-scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
agentscope-core = { path = "../agentscope-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Only the test stub models build a `BoxStream`; production code never touches it.
futures = { workspace = true }
# `test-util`: the misfire / first-firing tests drive `tokio::time` with a paused
# clock instead of sleeping real time, so cadence assertions stay deterministic.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
