[package]
name = "agentscope-extensions-acp"
description = "AgentScope Rust - ACP (Agent Client Protocol) coding agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
# 本 crate 自带 README（比根 README 更贴近 ACP），故不继承 workspace 的 readme。
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
agentscope-core = { workspace = true }
agentscope-extensions-model = { workspace = true }
agentscope-harness = { version = "0.1.0-alpha.1", path = "../agentscope-harness", default-features = false }
agent-client-protocol = { version = "2.2.0", features = [
    # 2.2.0（schema 1.9）起「程序化工具名」已在 v1 稳定，`unstable_tool_call_name`
    # 特性被移除。改动理由与影响见 memory/2026-10-16.md。
    #
    # 下列 unstable feature 逐个开启（不用聚合 `unstable`，因为它还含本项目
    # 明确暂缓的 `unstable_protocol_v2` / `unstable_session_fork`）：
    #   - unstable_session_notices        Session Notices（schema 1.9.0）
    #   - unstable_session_compaction     压缩进度通知
    #   - unstable_plan_operations        存续式 Plan（PlanUpdate/PlanRemoved）
    #   - unstable_llm_providers          providers/list|set|disable
    #   - unstable_end_turn_token_usage   PromptResponse.usage
    #   - unstable_mcp_over_acp           MCP-over-ACP 传输
    "unstable_session_notices",
    "unstable_session_compaction",
    "unstable_plan_operations",
    "unstable_llm_providers",
    "unstable_end_turn_token_usage",
    "unstable_mcp_over_acp",
] }
async-trait = { workspace = true }
chrono = { workspace = true }
# `catch_unwind` for the prompt future: a panic in the agent loop must not leave the
# client waiting for a response that never comes.
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[[bin]]
name = "acp_agent_cli"
path = "src/acp_agent_cli.rs"

[[bin]]
name = "acp_harness_agent"
path = "src/acp_harness_agent.rs"

[dev-dependencies]

[features]
default = ["rusqlite"]
rusqlite = ["agentscope-harness/rusqlite"]
# Embedded minimal build: mirrors `agentscope-harness`'s `lite` feature,
# dropping the bundled SQLite index.
lite = []
# Diagnostic only: install a counting global allocator so `[mem]` lines report live heap bytes
# (`src/mem.rs`). Not a default -- the atomics are on the allocation hot path.
alloc-stats = []

# The allocator is platform-specific. Session journaling builds megabyte-sized JSON payloads per
# turn; on Linux/glibc the default allocator keeps that burst in its arena (RSS never returns), so
# mimalloc hands it back. On Windows the CRT already releases large blocks on `free` and mimalloc
# measured *worse* (54 MB vs 4.6 MB peak RSS across 32 threads: one heap per thread, purged on a
# 1 s timer), so it is not installed there. Only the two binaries install it either way.
[target.'cfg(unix)'.dependencies]
mimalloc = "0.1"
# `mi_process_info` / `mi_collect` back the `src/mem.rs` diagnostics; the `extended` feature only
# adds FFI declarations on top of the same static library, it does not change how mimalloc builds.
libmimalloc-sys = { version = "0.1", features = ["extended"] }

# `GetProcessMemoryInfo` is the `src/mem.rs` footprint source once mimalloc is gone.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
