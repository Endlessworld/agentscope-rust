[package]
name = "agentscope-extensions-oss"
version.workspace = true
edition.workspace = true
license.workspace = true
# `rust-s3 0.38`（feature `s3`）要求 edition 2024 / Rust >= 1.85，故本 crate 保留本地
# `rust-version` 覆盖（不继承 workspace 的 1.80）；裁定见 EXTENSIONS_GAP_TRACKER §1.1。
rust-version = "1.85"

[features]
default = []
# Enables `S3OssClient`, a generic S3-compatible backend (AWS S3, MinIO, Ceph,
# Aliyun OSS S3-compatible endpoints, ...). Off by default so the crate still
# builds without the HTTP/TLS dependency stack; the trait-based surface
# (`OssClient` + `InMemoryOssClient`) is always available.
s3 = ["dep:rust-s3", "dep:tokio"]

[dependencies]
agentscope-core = { path = "../agentscope-core" }
agentscope-harness = { path = "../agentscope-harness" }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
# `tokio` is only used by the optional S3 backend (its dedicated worker thread owns a
# private runtime to drive `rust-s3` from the synchronous trait), so it is gated
# behind the `s3` feature and the default build stays free of the async runtime.
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "net", "time"] }
tracing = { workspace = true }
# Generic S3 backend. `default-features = false` avoids native-tls/OpenSSL; the
# `tokio-rustls-tls` feature pulls in rustls + tokio. `fail-on-err` makes
# non-2xx responses surface as typed `S3Error::HttpFailWithBody(status, body)`
# instead of raw response objects, so error mapping stays structured.
rust-s3 = { version = "0.38", optional = true, default-features = false, features = ["tokio-rustls-tls", "fail-on-err"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Local fake S3 over real HTTP for end-to-end tests (no cloud credentials).
httpmock = "0.7"

