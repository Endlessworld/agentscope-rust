[package]
name = "agentscope-extensions-oss"
description = "AgentScope Rust - S3-compatible object storage, sandbox snapshots and execution guard"
version.workspace = true
edition.workspace = true
license.workspace = true
# `rust-s3 0.38`（feature `s3`）要求 edition 2024 / Rust >= 1.85；workspace MSRV 自
# 2026-10-31 起为 `1.85.0`（OSS-09 裁定），本地声明仅为就地记录该依赖约束。
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Enables `S3OssClient`, a generic S3-compatible backend (AWS S3, MinIO, Ceph,
# Aliyun OSS S3-compatible endpoints, ...). Off by default so the crate still
# builds without the HTTP/TLS dependency stack; the trait-based surface
# (`OssClient` + `InMemoryOssClient`) is always available.
s3 = ["dep:rust-s3", "dep:tokio", "dep:md5"]

[dependencies]
agentscope-core = { workspace = true }
agentscope-harness = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
# `tokio` is only used by the optional S3 backend (its dedicated worker thread owns a
# private runtime to drive `rust-s3` from the synchronous trait), so it is gated
# behind the `s3` feature and the default build stays free of the async runtime.
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "net", "time"] }
tracing = { workspace = true }
# Generic S3 backend. `default-features = false` avoids native-tls/OpenSSL; the
# `tokio-rustls-tls` feature pulls in rustls + tokio. `fail-on-err` makes
# non-2xx responses surface as typed `S3Error::HttpFailWithBody(status, body)`
# instead of raw response objects, so error mapping stays structured.
rust-s3 = { version = "0.38", optional = true, default-features = false, features = ["tokio-rustls-tls", "fail-on-err"] }
# `rust-s3` reports a part's ETag from the response *body*, but S3 sends the part ETag as a
# header and leaves the body empty. The multipart upload therefore derives the part ETags
# itself (MD5 of the part, which is what S3 uses for non-KMS uploads); same version as the
# one `rust-s3` already depends on.
md5 = { version = "0.8", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Local fake S3 over real HTTP for end-to-end tests (no cloud credentials).
httpmock = "0.7"
# Expected multipart part ETags in the wire assertions (S3 uses the part's MD5).
md5 = "0.8"

