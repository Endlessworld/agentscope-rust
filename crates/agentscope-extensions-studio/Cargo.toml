[package]
name = "agentscope-extensions-studio"
description = "AgentScope Rust - AgentScope Studio integration and OpenTelemetry GenAI telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
agentscope-core = { workspace = true }
agentscope-harness = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["io-std"] }
futures = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }

[dev-dependencies]
# `net`/`test-util`: the manager regression test plays a local Socket.IO server and the
# batch-export tests drive `tokio::time::pause`/`advance` instead of sleeping.
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "rt-multi-thread",
    "net",
    "test-util",
] }

