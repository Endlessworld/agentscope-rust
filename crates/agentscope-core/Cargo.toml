[package]
name = "agentscope-core"
description = "AgentScope Rust - Core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
async-trait.workspace = true
reqwest.workspace = true
# `async-openai` 0.41 depends on reqwest 0.13 while the rest of the workspace
# pins 0.12; aliased so the custom (timeout-configured) HTTP client built here
# matches the version `Client::with_http_client` expects.
reqwest13 = { package = "reqwest", version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
schemars.workspace = true
serde_yaml.workspace = true
base64.workspace = true
jsonschema.workspace = true
tracing-subscriber.workspace = true
async-openai = { version = "0.41", default-features = false, features = ["chat-completion", "chat-completion-types", "byot", "middleware", "rustls", "responses", "response-types"] }
async-anthropic = { version = "0.6", default-features = false, features = ["rustls"] }

[dev-dependencies]
