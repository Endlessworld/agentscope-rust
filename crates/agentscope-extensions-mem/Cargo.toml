[package]
name = "agentscope-extensions-mem"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
agentscope-core = { path = "../agentscope-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
# `tokio` is a runtime dependency because the retry decorator sleeps between
# attempts (`tokio::time::sleep`); it also drives the `#[tokio::test]` cases.
# `futures` and `agentscope-harness` were declared but never referenced and were
# dropped (see MEM__GAP_TRACKER.md §3.3).
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
# `futures` builds the `EventStream` values returned by
# `MemLongTermMemoryMiddleware` (`stream::once(...).chain(...)` / `flatten`), i.e. it is
# on the production assembly path since MEM-01.
futures = { workspace = true }

[dev-dependencies]
# MEM-01 acceptance: the long-term-memory wiring is exercised through the real
# `HarnessAgent` assembly entry (`builder().middleware(chain)`), not by poking the
# adapter. Only a dev-dependency: the crate itself stays harness-agnostic, and the
# dependency is acyclic (harness does not depend on this crate).
agentscope-harness = { path = "../agentscope-harness" }

