[package]
name = "agentscope-extensions-channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
agentscope-core = { path = "../agentscope-core" }
agentscope-harness = { path = "../agentscope-harness" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
# --- CHANNEL platform-adapter deps (Java: okhttp/WebClient -> reqwest, jackson -> serde) ---
reqwest = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
percent-encoding = "2.3"
# WeCom callbacks arrive as XML; the Java mapper uses DOM getElementsByTagName.
quick-xml = "0.39"
# javax.crypto Cipher("AES/CBC/NoPadding") -> RustCrypto AES + CBC mode.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
# DingTalk Stream is a persistent WebSocket gateway (Java java.net.http.WebSocket).
tokio-tungstenite = { version = "0.29", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }

