[package]
name = "agentscope-extensions-rag"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
agentscope-core = { path = "../agentscope-core" }
agentscope-harness = { path = "../agentscope-harness" }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
# PgVectorStore 的轻薄真实驱动适配层（SQL 构造/解析已抽为纯函数，测试不连库）。
tokio-postgres = { workspace = true }
# Bailian signs its requests with ACS4-HMAC-SHA256; the Java SDK pulled these in transitively.
hmac = "0.12"
sha2 = "0.10"
uuid = { workspace = true }
# DashScope multimodal embedding inlines local image files as `data:` URLs.
base64 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

