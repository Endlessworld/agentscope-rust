[package]
name = "agentscope-harness"
description = "AgentScope Rust - Harness"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
agentscope-core = { path = "../agentscope-core" }
agentscope-extensions-model = { path = "../agentscope-extensions-model" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true
reqwest.workspace = true
serde_yaml.workspace = true
chrono.workspace = true
uuid.workspace = true
base64.workspace = true
sha2.workspace = true
regex = "1"
globset = "0.4"
rusqlite = { workspace = true, optional = true }
rust-mcp-sdk = { version = "1.0.1", default-features = false, features = ["client", "stdio", "macros"] }
# Client-side SSE/Streamable-HTTP transports. Pulled directly (not via the sdk's
# `sse`/`streamable-http` features) because those features also compile a broken
# server-side `mcp_http` module in rust-mcp-sdk 1.0.1.
rust-mcp-transport = { version = "1.0.0", default-features = false, features = ["sse", "streamable-http"] }

# 2.2.0（schema 1.9）起「程序化工具名」已在 v1 稳定，`unstable_tool_call_name`
# 特性被移除，故不再声明任何 feature。改动理由与影响见 memory/2026-10-16.md。
agent-client-protocol = { version = "2.2.0" }

[[bin]]
name = "acp_agent_cli"
path = "src/acp/acp_agent_cli.rs"

[[bin]]
name = "acp_harness_agent"
path = "src/acp/acp_harness_agent.rs"

[features]
# 默认启用 SQLite 索引（原行为）；`lite` 为嵌入式最小集，
# 通过 `--no-default-features --features lite` 构建，去掉 rusqlite bundled
# （C 引擎静态链接 1~3MB），workspace 索引降级为全量目录扫描。
default = ["rusqlite"]
rusqlite = ["dep:rusqlite"]
lite = []