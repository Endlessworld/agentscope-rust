[package]
name = "agentscope-harness"
description = "AgentScope Rust - Harness"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
agentscope-core = { workspace = true }
agentscope-extensions-model = { workspace = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
futures.workspace = true
tracing.workspace = true
async-trait.workspace = true
reqwest.workspace = true
serde_yaml.workspace = true
chrono.workspace = true
uuid.workspace = true
base64.workspace = true
sha2.workspace = true
regex = "1"
globset = "0.4"
ignore.workspace = true
rusqlite = { workspace = true, optional = true }
rust-mcp-sdk = { workspace = true, features = ["client", "stdio", "macros"] }
# Client-side SSE/Streamable-HTTP transports. Pulled directly (not via the sdk's
# `sse`/`streamable-http` features) because those features also compile a broken
# server-side `mcp_http` module in rust-mcp-sdk 1.0.1.
rust-mcp-transport = { version = "1.0.0", default-features = false, features = ["sse", "streamable-http"] }

[features]
# 默认启用 SQLite 索引（原行为）；`lite` 为嵌入式最小集，
# 通过 `--no-default-features --features lite` 构建，去掉 rusqlite bundled
# （C 引擎静态链接 1~3MB），workspace 索引降级为全量目录扫描。
default = ["rusqlite"]
rusqlite = ["dep:rusqlite"]
lite = []