[package]
name = "agentscope-extensions-model"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
agentscope-core = { path = "../agentscope-core" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
# NOTE: `chrono` / `thiserror` were declared but never referenced (timestamps go
# through `tracing`, errors through the hand-written `ModelError`), so they were
# dropped in the 2026-10-31 loop.
# 本 crate 新增依赖（用具体版本号，见 docs/extensions/MODEL__GAP_TRACKER.md §4.2）
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { workspace = true }
base64 = "0.22"
async-stream = "0.3"
# OpenAI/Anthropic 官方协议实现（自 agentscope-core 迁入，2026-09-21）
# `async-anthropic` 0.6 仍钉住 reqwest 0.12（其 `Client::http_client` 参数类型
# 即该版本的 `reqwest::Client`），workspace 统一到 0.13 后只能以别名保留一个
# 0.12 实例，仅用于 anthropic_async 注入自定义 HTTP client。
reqwest12 = { package = "reqwest", version = "0.12", default-features = false, features = ["json"] }
async-openai = { version = "0.41", default-features = false, features = ["chat-completion", "chat-completion-types", "byot", "middleware", "rustls", "responses", "response-types"] }
async-anthropic = { version = "0.6", default-features = false, features = ["rustls"] }
# DashScope 请求加密（对齐 Java JCE：AES-256/GCM/NoPadding + RSA/ECB/PKCS1Padding）。
# `rand` 0.8 是 `rsa` 0.9 与 `aes-gcm` 0.10 共用的 `rand_core` 0.6 生态，仅用于 CSPRNG。
aes-gcm = "0.10"
rsa = "0.9"
rand = "0.8"

