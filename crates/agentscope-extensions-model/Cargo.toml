[package]
name = "agentscope-extensions-model"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
agentscope-core = { path = "../agentscope-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
# 本 crate 新增依赖（用具体版本号，见 docs/extensions/MODEL__GAP_TRACKER.md §4.2）
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
base64 = "0.22"
async-stream = "0.3"
# OpenAI/Anthropic 官方协议实现（自 agentscope-core 迁入，2026-09-21）
# `async-openai` 0.41 依赖 reqwest 0.13，与 workspace 的 0.12 不同；
# 以别名 reqwest13 引入，匹配 Client::with_http_client 所需的版本。
reqwest13 = { package = "reqwest", version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
async-openai = { version = "0.41", default-features = false, features = ["chat-completion", "chat-completion-types", "byot", "middleware", "rustls", "responses", "response-types"] }
async-anthropic = { version = "0.6", default-features = false, features = ["rustls"] }

