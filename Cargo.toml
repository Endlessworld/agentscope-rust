[workspace]
resolver = "2"
members = [
    "crates/agentscope-core",
    "crates/agentscope-harness",
    # agentscope-extensions/* 迁移 crate（每个 crate 由 docs/extensions/<MODULE>__GAP_TRACKER.md 跟踪）
    "crates/agentscope-extensions-model",
    "crates/agentscope-extensions-protocol",
    "crates/agentscope-extensions-a2a-client",
    "crates/agentscope-extensions-a2a-server",
    "crates/agentscope-extensions-agent-protocol",
    "crates/agentscope-extensions-agui",
    "crates/agentscope-extensions-chat-completions-web",
    "crates/agentscope-extensions-acp",
    "crates/agentscope-extensions-rag",
    "crates/agentscope-extensions-sandbox",
    "crates/agentscope-extensions-channel",
    "crates/agentscope-extensions-mem",
    "crates/agentscope-extensions-jdbc",
    "crates/agentscope-extensions-redis",
    "crates/agentscope-extensions-mongodb",
    "crates/agentscope-extensions-mysql",
    "crates/agentscope-extensions-postgresql",
    "crates/agentscope-extensions-cos",
    "crates/agentscope-extensions-oss",
    "crates/agentscope-extensions-controlplane",
    "crates/agentscope-extensions-studio",
    "crates/agentscope-extensions-skills",
    "crates/agentscope-extensions-scheduler",
    "crates/agentscope-extensions-training",
    "crates/agentscope-extensions-nacos",
    "crates/agentscope-extensions-higress",
    "crates/agentscope-extensions-judge",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/Endlessworld/agentscope-rust"
homepage = "https://github.com/Endlessworld/agentscope-rust"
keywords = ["agent", "llm", "ai", "agentscope","harness"]
categories = ["development-tools", "asynchronous"]
rust-version = "1.85.0"

[workspace.dependencies]
# 内部 crate：`path` 供本地开发，`version` 供 crates.io 发布（发布时 cargo 会丢掉 path）。
# 注意：成员侧写 `default-features = false` 在继承模式下会被 cargo 忽略，故
# `agentscope-extensions-acp` 对 `agentscope-harness` 仍用显式 `{ version, path, default-features }`。
agentscope-core = { version = "0.1.0-alpha.1", path = "crates/agentscope-core" }
agentscope-harness = { version = "0.1.0-alpha.1", path = "crates/agentscope-harness" }
agentscope-extensions-model = { version = "0.1.0-alpha.1", path = "crates/agentscope-extensions-model" }
agentscope-extensions-protocol = { version = "0.1.0-alpha.1", path = "crates/agentscope-extensions-protocol" }
agentscope-extensions-a2a-client = { version = "0.1.0-alpha.1", path = "crates/agentscope-extensions-a2a-client" }
agentscope-extensions-a2a-server = { version = "0.1.0-alpha.1", path = "crates/agentscope-extensions-a2a-server" }
agentscope-extensions-agent-protocol = { version = "0.1.0-alpha.1", path = "crates/agentscope-extensions-agent-protocol" }
agentscope-extensions-agui = { version = "0.1.0-alpha.1", path = "crates/agentscope-extensions-agui" }
agentscope-extensions-chat-completions-web = { version = "0.1.0-alpha.1", path = "crates/agentscope-extensions-chat-completions-web" }
agentscope-extensions-acp = { version = "0.1.0-alpha.1", path = "crates/agentscope-extensions-acp" }
agentscope-extensions-rag = { version = "0.1.0-alpha.1", path = "crates/agentscope-extensions-rag" }
agentscope-extensions-sandbox = { version = "0.1.0-alpha.1", path = "crates/agentscope-extensions-sandbox" }
agentscope-extensions-channel = { version = "0.1.0-alpha.1", path = "crates/agentscope-extensions-channel" }
agentscope-extensions-mem = { version = "0.1.0-alpha.1", path = "crates/agentscope-extensions-mem" }
agentscope-extensions-jdbc = { version = "0.1.0-alpha.1", path = "crates/agentscope-extensions-jdbc" }
agentscope-extensions-redis = { version = "0.1.0-alpha.1", path = "crates/agentscope-extensions-redis" }
agentscope-extensions-mongodb = { version = "0.1.0-alpha.1", path = "crates/agentscope-extensions-mongodb" }
agentscope-extensions-mysql = { version = "0.1.0-alpha.1", path = "crates/agentscope-extensions-mysql" }
agentscope-extensions-postgresql = { version = "0.1.0-alpha.1", path = "crates/agentscope-extensions-postgresql" }
agentscope-extensions-cos = { version = "0.1.0-alpha.1", path = "crates/agentscope-extensions-cos" }
agentscope-extensions-oss = { version = "0.1.0-alpha.1", path = "crates/agentscope-extensions-oss" }
agentscope-extensions-controlplane = { version = "0.1.0-alpha.1", path = "crates/agentscope-extensions-controlplane" }
agentscope-extensions-studio = { version = "0.1.0-alpha.1", path = "crates/agentscope-extensions-studio" }
agentscope-extensions-skills = { version = "0.1.0-alpha.1", path = "crates/agentscope-extensions-skills" }
agentscope-extensions-scheduler = { version = "0.1.0-alpha.1", path = "crates/agentscope-extensions-scheduler" }
agentscope-extensions-training = { version = "0.1.0-alpha.1", path = "crates/agentscope-extensions-training" }
agentscope-extensions-nacos = { version = "0.1.0-alpha.1", path = "crates/agentscope-extensions-nacos" }
agentscope-extensions-higress = { version = "0.1.0-alpha.1", path = "crates/agentscope-extensions-higress" }
agentscope-extensions-judge = { version = "0.1.0-alpha.1", path = "crates/agentscope-extensions-judge" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time", "fs", "io-util", "process", "rt-multi-thread"] }
futures = "0.3"
tracing = "0.1"
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider", "gzip", "deflate", "system-proxy"] }
# 单一 rustls 加密后端。`reqwest` 0.13 改用 `rustls-no-provider`（见上），由
# `agentscope_core::tls::ensure_crypto_provider` 在进程内安装 `ring`；`reqwest` 0.12
# （经 rust-mcp-transport / async-anthropic 引入）本来就默认选 `ring`。两边统一后
# `aws-lc-rs` 不再编译，嵌入产物 -0.8MB。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1"
# 关闭默认特性：默认开启的 `resolve-http` 会拉入 reqwest 0.12，与 workspace 统一的
# 0.13 冲突。本仓只用内联 schema 校验（`validator_for`），不需要远程 `$ref` 解析。
jsonschema = { version = "0.30", default-features = false, features = ["resolve-file"] }
serde_yaml = "0.9"
sha2 = "0.10"
base64 = "0.22"
# 目录遍历（harness 的 grep/glob 需要 .gitignore / .ignore 语义；与 rg 同源实现）。
ignore = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP 服务端选型：统一 axum（protocol / controlplane / channel；裁定见
# docs/extensions/EXTENSIONS_GAP_TRACKER.md §2.1 "HTTP 框架选型"）。
axum = { version = "0.7", default-features = false, features = ["json", "tokio", "http1", "query"] }
http = "1"
bytes = "1"

# MCP 客户端 SDK：harness 与 higress 共用，版本必须一致，故上提 workspace（2026-10-29）。
rust-mcp-sdk = { version = "1.0.1", default-features = false }
# skill 包 zip（NACOS 的 skill 资源上传/下载）。
zip = { version = "0.6", default-features = false, features = ["deflate"] }

# 真实后端驱动（存储/技能模块 P1；由各 crate 以可选依赖 + feature 引入，默认仍走内存实现）。
sqlx = "0.9"
mysql_async = "0.37"
tokio-postgres = "0.7"
mongodb = "3"
redis = { version = "1.7", default-features = false, features = ["script", "tokio-comp", "connection-manager"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

# 依赖求快、自身代码求小（体积/性能折中，通常不增体积却明显提速）。
[profile.release.package."*"]
opt-level = 3

# 嵌入式极限优化 profile：继承 release，供 `cargo build --profile embedded` 使用。
[profile.embedded]
inherits = "release"
opt-level = "z"        # 已定：体积优先
lto = true            # 启用链接时优化，跨 crate 消除死代码
codegen-units = 1
# panic 策略：immediate-abort 在新 nightly 需 `cargo-features = ["panic-immediate-abort"]`
# opt-in（写 profile 或 config 都一样），而那个 key 会让 stable cargo 拒绝解析 manifest。
# 用 rustflags 传 -Cpanic=immediate-abort 则与 cargo 自带的 -Cpanic=abort 冲突（实测：
# "core was compiled with a panic strategy which is incompatible with immediate-abort"）。
# 故此处保持 abort。
panic = "abort"
strip = "symbols"
debug = false     # 关键：不生成调试信息

# 嵌入式要的是体积：依赖也按尺寸优化（与 release 的「依赖求快」相反）。
[profile.embedded.package."*"]
opt-level = "z"

# 构建脚本 / proc-macro 提速（只影响编译期，不影响产物）。
[profile.embedded.build-override]
opt-level = 3
