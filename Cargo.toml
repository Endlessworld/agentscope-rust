[workspace]
resolver = "2"
members = [
    "crates/agentscope-core",
    "crates/agentscope-harness",
    # agentscope-extensions/* 迁移 crate（每个 crate 由 docs/extensions/<MODULE>__GAP_TRACKER.md 跟踪）
    "crates/agentscope-extensions-model",
    "crates/agentscope-extensions-protocol",
    "crates/agentscope-extensions-rag",
    "crates/agentscope-extensions-sandbox",
    "crates/agentscope-extensions-channel",
    "crates/agentscope-extensions-mem",
    "crates/agentscope-extensions-jdbc",
    "crates/agentscope-extensions-redis",
    "crates/agentscope-extensions-mongodb",
    "crates/agentscope-extensions-mysql",
    "crates/agentscope-extensions-postgresql",
    "crates/agentscope-extensions-cos",
    "crates/agentscope-extensions-oss",
    "crates/agentscope-extensions-aistio",
    "crates/agentscope-extensions-studio",
    "crates/agentscope-extensions-skills",
    "crates/agentscope-extensions-scheduler",
    "crates/agentscope-extensions-training",
    "crates/agentscope-extensions-nacos",
    "crates/agentscope-extensions-higress",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time", "fs", "io-util", "process", "rt-multi-thread"] }
futures = "0.3"
tracing = "0.1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
schemars = "1"
jsonschema = "0.30"
serde_yaml = "0.9"
sha2 = "0.10"
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP 服务端选型：统一 axum（protocol / aistio / channel；裁定见
# docs/extensions/EXTENSIONS_GAP_TRACKER.md §2.1 "HTTP 框架选型"）。
axum = { version = "0.7", default-features = false, features = ["json", "tokio", "http1", "query"] }
http = "1"
bytes = "1"

# 真实后端驱动（存储/技能模块 P1；由各 crate 以可选依赖 + feature 引入，默认仍走内存实现）。
sqlx = "0.9"
mysql_async = "0.37"
tokio-postgres = "0.7"
mongodb = "3"
object_store = "0.14"
redis = { version = "1.7", default-features = false, features = ["script", "tokio-comp", "connection-manager"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

# 嵌入式极限优化 profile：继承 release，供 `cargo build --profile embedded` 使用。
[profile.embedded]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false     # 关键：不生成调试信息