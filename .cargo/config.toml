# 构建配置：禁用 incremental 编译。
# 原因：本仓库目标盘（E:）容量紧张，target/debug/incremental 曾累积 ~19.5GB
# 导致 `os error 112` / rustc-LLVM IO failure 的假编译失败（见
# docs/extensions/EXTENSIONS_GAP_TRACKER.md §3.2）。
# 如需恢复默认行为，删除本文件或改为 incremental = true。
[build]
incremental = false

# 极限嵌入构建的额外 RUSTFLAGS（含 nightly `-Z`）不写在本文件——cargo 无法按
# profile / toolchain 区分 rustflags，写在此处会连累 stable 下的 cargo build/test。
# 它们存放在 .cargo/config.embedded.toml，需显式指定：
#   cargo +nightly build --profile embedded --config .cargo/config.embedded.toml
